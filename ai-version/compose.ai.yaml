services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.ai
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks
    depends_on:
      - db
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
